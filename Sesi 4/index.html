<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sesi 4</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="logo" href="#">Shop<span>Easy</span></a>
      <button class="cart-toggle" id="cart-toggle" aria-label="Buka keranjang">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.6 8H19M7 13l-1-5M10 21a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2z"/>
        </svg>
        <span class="cart-badge" id="cart-badge" style="display:none">0</span>
      </button>
    </div>
  </header>

  <!-- Cart overlay -->
  <div class="cart-overlay" id="cart-overlay"></div>

  <!-- Cart sidebar -->
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2>Keranjang <span id="cart-header-count"></span></h2>
      <button class="cart-close" id="cart-close" aria-label="Tutup keranjang">&times;</button>
    </div>

    <div class="cart-body" id="cart-body">
      <!-- items rendered by JS -->
    </div>

    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-summary">
        <div class="cart-summary-row">
          <span>Subtotal (<span id="cart-item-count">0</span> item)</span>
          <span id="cart-subtotal">Rp 0</span>
        </div>
        <div class="cart-summary-row cart-total-row">
          <strong>Total</strong>
          <strong id="cart-total">Rp 0</strong>
        </div>
      </div>
      <button class="btn-checkout">Lanjut ke Pembayaran</button>
    </div>
  </aside>

  <main>
    <div class="page-header">
      <h1>Semua Produk</h1>
      <p>Temukan produk terbaik untuk kebutuhanmu</p>
    </div>

    <!-- Filter buttons -->
    <div class="filter-bar">
      <button class="filter-btn active" data-category="all">Semua</button>
      <button class="filter-btn" data-category="electronics">Elektronik</button>
      <button class="filter-btn" data-category="fashion">Fashion</button>
      <button class="filter-btn" data-category="homeliving">Rumah &amp; Taman</button>
      <button class="filter-btn" data-category="sports">Olahraga</button>
      <button class="filter-btn" data-category="shoes">Sepatu</button>
      <button class="filter-btn" data-category="books">Buku &amp; ATK</button>
      <span class="filter-count" id="product-count"></span>
    </div>

    <!-- Product grid (JS renders here) -->
    <div id="product-grid"></div>

    <!-- Empty state -->
    <div id="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.6 8H19M7 13l-1-5M10 21a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2z"/>
      </svg>
      <p>Tidak ada produk ditemukan.</p>
    </div>
  </main>

  <!-- Toast notification -->
  <div id="toast"></div>

  <footer>
    <p>&copy; 2026 ShopEasy. Dibuat dengan HTML, CSS &amp; JavaScript.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
